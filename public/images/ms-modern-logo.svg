<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="modernBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#181329" />
      <stop offset="60%" stop-color="#0c0915" />
      <stop offset="100%" stop-color="#05030a" />
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="modernBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Vibrant Electric Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#modernBg)" stroke="url(#modernBorder)" stroke-width="2.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="50" cy="50" r="50" fill="#6366f1" opacity="0.25" filter="url(#glowEffect)" />
  <circle cx="150" cy="150" r="50" fill="#06b6d4" opacity="0.2" filter="url(#glowEffect)" />

  <!-- MONOGRAM "MS" -->
  <g filter="url(#shadowEffect)">
    <!-- Letter M (Left Leg) -->
    <path d="M 46 150 L 46 60 C 46 52 52 46 60 46 C 68 46 74 52 74 60 L 74 110 L 93 84 C 97 79 103 79 107 84 L 126 110 L 126 60 C 126 52 132 46 140 46 C 148 46 154 52 154 60 L 154 150 C 154 158 148 164 140 164 C 132 164 126 158 126 150 L 126 114 L 100 148 L 74 114 L 74 150 C 74 158 68 164 60 164 C 52 164 46 158 46 150 Z" 
          fill="url(#neonGradient)" />

    <!-- Letter S (Liquid Gold Dynamic Wave layered across M) -->
    <path d="M 148 64 C 148 50 134 40 114 40 C 90 40 76 52 76 66 C 76 80 90 88 110 93 C 132 99 144 107 144 122 C 144 140 126 152 102 152 C 78 152 64 140 60 126" 
          fill="none" 
          stroke="url(#goldRibbon)" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glowEffect)" />

    <!-- Inner Core Light on S -->
    <path d="M 144 64 C 144 54 132 46 114 46 C 94 46 84 55 84 66 C 84 76 96 83 112 87 C 130 92 138 99 138 120 C 138 134 122 144 102 144 C 84 144 72 136 68 126" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          opacity="0.8" />
  </g>

  <!-- Modern Star Sparkle Accent -->
  <g transform="translate(158, 42) scale(0.85)" fill="#fef08a" filter="url(#glowEffect)">
    <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
</svg>

