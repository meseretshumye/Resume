<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Electric Cyan-Indigo for "M" -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Radiant Liquid Gold for "S" -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for layered 3D ribbon effect -->
    <filter id="ribbonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="6" y="6" width="188" height="188" rx="46" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Internal Flares -->
  <circle cx="60" cy="50" r="45" fill="#38bdf8" opacity="0.18" filter="url(#subtleGlow)" />
  <circle cx="140" cy="150" r="50" fill="#a855f7" opacity="0.18" filter="url(#subtleGlow)" />
  <circle cx="100" cy="100" r="35" fill="#fbbf24" opacity="0.12" filter="url(#subtleGlow)" />

  <!-- MONOGRAM GROUP -->
  <g transform="translate(0, 0)">
    
    <!-- 1. The Architectural Letter "M" -->
    <!-- Left Pillar -->
    <rect x="42" y="48" width="16" height="104" rx="8" fill="url(#mGrad)" />
    <!-- Right Pillar -->
    <rect x="142" y="48" width="16" height="104" rx="8" fill="url(#mGrad)" />

    <!-- Left Diagonal Chevron -->
    <path d="M 44 56 C 44 50 52 46 57 50 L 100 95 L 89 106 L 47 62 C 45 60 44 58 44 56 Z" fill="url(#mGrad)" />
    
    <!-- Right Diagonal Chevron -->
    <path d="M 156 56 C 156 50 148 46 143 50 L 100 95 L 111 106 L 153 62 C 155 60 156 58 156 56 Z" fill="url(#mGrad)" />

    <!-- Center Apex Gem Node -->
    <polygon points="100,90 108,100 100,110 92,100" fill="#38bdf8" opacity="0.9" filter="url(#subtleGlow)" />

    <!-- 2. The Weaving Golden Ribbon "S" -->
    <!-- Layered with ribbonShadow so it floats over and through the M -->
    <g filter="url(#ribbonShadow)">
      <!-- Top Arc of S -->
      <path d="M 148 70 C 148 52 130 40 108 40 C 78 40 68 56 68 70 C 68 86 84 94 104 100 C 128 106 142 115 142 130 C 142 148 122 160 98 160 C 72 160 56 148 54 130" 
            fill="none" 
            stroke="url(#goldGrad)" 
            stroke-width="15" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Top Inner Golden Shimmer Spine -->
      <path d="M 144 68 C 144 55 128 46 108 46 C 82 46 74 58 74 70 C 74 82 86 89 104 95 C 126 101 136 109 136 126 C 136 142 120 154 98 154 C 76 154 62 144 60 130" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="3" 
            stroke-linecap="round" 
            opacity="0.75" />
    </g>

    <!-- Accentuation Sparkles -->
    <!-- Top-Right Diamond Sparkle -->
    <g transform="translate(162, 38) scale(0.9)" fill="#fef08a" filter="url(#subtleGlow)">
      <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>

    <!-- Bottom-Left Micro Sparkle -->
    <g transform="translate(36, 162) scale(0.65)" fill="#38bdf8" filter="url(#subtleGlow)">
      <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>
</svg>

