    <text x="618" y="285" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">RX-89413 • Felege Hiwot Clinic</text>
    <text x="618" y="303" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Auto-Validated • Stock Reserved</text>
    <rect x="765" y="275" width="60" height="20" rx="10" fill="#0c4a6e" />
    <text x="772" y="289" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">DISPENSE</text>

