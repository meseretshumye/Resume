    <text x="618" y="210" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">RX-89412 • St. Paul Hospital</text>
    <text x="618" y="228" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Dr. M. Tesfaye • Digital Signed</text>
