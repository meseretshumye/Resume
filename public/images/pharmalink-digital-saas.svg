  <circle cx="1050" cy="500" r="220" fill="#8b5cf6" opacity="0.14" filter="url(#softGlow)" />
  <circle cx="650" cy="280" r="140" fill="#10b981" opacity="0.08" filter="url(#softGlow)" />

  <!-- Application Window Frame (macOS Dark Glass Aesthetic) -->
  <rect x="40" y="30" width="1120" height="615" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header / Title Bar -->
  <rect x="40" y="30" width="1120" height="52" rx="20" fill="#0f172a" opacity="0.9" />
  <line x1="40" y1="82" x2="1160" y2="82" stroke="#1e293b" stroke-width="1" />

  <!-- Window Controls -->
