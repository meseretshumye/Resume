    <path d="M 18 10 L 18 26 M 10 18 L 26 18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <text x="46" y="22" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">PharmaLink</text>
