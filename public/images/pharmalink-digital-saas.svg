    <text x="36" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">E-Prescription Routing</text>
    <text x="36" y="175" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Supply Telemetry</text>
    <text x="36" y="225" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Batch Expiry AI</text>
    <text x="36" y="275" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Multi-Tenant Vault</text>
