<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#111115" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="titaniumCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1f" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>
    <linearGradient id="appleBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#47a3ff" />
    </linearGradient>
    <linearGradient id="goldTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5d0b6" />
      <stop offset="100%" stop-color="#9a8064" />
    </linearGradient>
    <filter id="glowApple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#appleBg)" />

  <!-- Subtle glow backdrops -->
  <circle cx="200" cy="200" r="160" fill="#0071e3" opacity="0.12" filter="url(#glowApple)" />
  <circle cx="650" cy="350" r="150" fill="#9a8064" opacity="0.1" filter="url(#glowApple)" />

  <!-- Top Apple Nav Bar Mockup -->
  <rect x="40" y="25" width="720" height="46" rx="12" fill="#161617" opacity="0.9" stroke="#2c2c2e" stroke-width="1" />
  
  <!-- Apple Logo symbol representation -->
  <path d="M 68 44 C 69 41 71 39 74 39 C 74 42 72 44 68 44 Z M 77 47 C 75 47 74 46 72 46 C 70 46 68 47 67 47 C 65 47 63 45 62 42 C 60 38 61 34 64 34 C 65 34 67 35 68 35 C 70 35 71 34 73 34 C 74 34 76 35 77 36 C 75 37 75 40 77 41 C 76 43 75 46 73 48 C 74 48 76 47 77 47 Z" fill="#f5f5f7" transform="scale(0.8) translate(15, 6)" />

  <text x="105" y="53" fill="#f5f5f7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Apple Store</text>

  <!-- Nav links -->
  <text x="230" y="52" fill="#a1a1a6" font-family="system-ui, -apple-system, sans-serif" font-size="12">Store</text>
  <text x="290" y="52" fill="#a1a1a6" font-family="system-ui, -apple-system, sans-serif" font-size="12">Mac</text>
  <text x="345" y="52" fill="#a1a1a6" font-family="system-ui, -apple-system, sans-serif" font-size="12">iPhone</text>
  <text x="410" y="52" fill="#a1a1a6" font-family="system-ui, -apple-system, sans-serif" font-size="12">Watch</text>
  <text x="475" y="52" fill="#a1a1a6" font-family="system-ui, -apple-system, sans-serif" font-size="12">AirPods</text>

  <!-- E-COMMERCE Badge -->
  <rect x="550" y="37" width="110" height="22" rx="11" fill="#0071e3" opacity="0.25" stroke="#0071e3" stroke-width="1" />
  <text x="562" y="52" fill="#47a3ff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">E-COMMERCE</text>

  <!-- Bag icon badge -->
  <circle cx="730" cy="48" r="14" fill="#2c2c2e" />
  <text x="726" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">3</text>

  <!-- Main Hero / Product Presentation Area -->
  <g transform="translate(40, 85)">
    <!-- Main Showcase Card (Left) -->
    <rect width="420" height="380" rx="20" fill="url(#titaniumCard)" stroke="#2c2c2e" stroke-width="1" />
    
    <text x="35" y="45" fill="#f5f5f7" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">MacBook Pro 16”</text>
    <text x="35" y="70" fill="#a1a1a6" font-family="system-ui, -apple-system, sans-serif" font-size="13">Engineered for extreme creative workflows with M3 Max.</text>

    <!-- Laptop Mockup Vector -->
    <g transform="translate(60, 95)">
      <!-- Display Frame -->
      <rect x="30" y="10" width="240" height="150" rx="8" fill="#000000" stroke="#48484a" stroke-width="2" />
      <rect x="38" y="18" width="224" height="134" rx="4" fill="#0a0a0f" />
      <!-- Wallpaper graphic on screen -->
      <path d="M 38 100 Q 150 40 262 130 L 262 152 L 38 152 Z" fill="url(#appleBlue)" opacity="0.6" />
      <circle cx="150" cy="80" r="28" fill="#9a8064" opacity="0.5" filter="url(#glowApple)" />
      
      <!-- Laptop Base / Keyboard -->
      <polygon points="10,165 290,165 270,180 30,180" fill="#3a3a3c" stroke="#545458" stroke-width="1" />
      <rect x="130" y="165" width="40" height="3" rx="1.5" fill="#636366" />
    </g>

    <!-- Specs Pills -->
    <g transform="translate(35, 290)">
      <rect x="0" y="0" width="105" height="28" rx="8" fill="#2c2c2e" />
      <text x="12" y="18" fill="#e5e5ea" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">M3 Max Chip</text>

      <rect x="115" y="0" width="105" height="28" rx="8" fill="#2c2c2e" />
      <text x="125" y="18" fill="#e5e5ea" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">36GB Unified</text>

      <rect x="230" y="0" width="115" height="28" rx="8" fill="#2c2c2e" />
      <text x="242" y="18" fill="#e5e5ea" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">1TB SSD Storage</text>
    </g>

    <!-- Pricing & Buy CTA -->
    <g transform="translate(35, 335)">
      <text x="0" y="24" fill="#f5f5f7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">$2,499.00</text>
      <text x="110" y="24" fill="#86868b" font-family="system-ui, -apple-system, sans-serif" font-size="11">or $208.25/mo.</text>

      <rect x="220" y="0" width="130" height="36" rx="18" fill="url(#appleBlue)" />
      <text x="248" y="23" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Add to Bag</text>
    </g>
  </g>

  <!-- Right Hand Product / Interactive Configurator -->
  <g transform="translate(480, 85)">
    <rect width="280" height="380" rx="20" fill="url(#titaniumCard)" stroke="#2c2c2e" stroke-width="1" />

    <text x="25" y="38" fill="#f5f5f7" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">iPhone 16 Pro</text>
    <text x="25" y="58" fill="#86868b" font-family="system-ui, -apple-system, sans-serif" font-size="12">Natural Titanium • From $999</text>

    <!-- Color Swatches -->
    <text x="25" y="90" fill="#a1a1a6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">FINISH</text>
    <circle cx="35" cy="115" r="12" fill="#c2b8ad" stroke="#0071e3" stroke-width="2" />
    <circle cx="70" cy="115" r="12" fill="#444446" />
    <circle cx="105" cy="115" r="12" fill="#f2f1ed" />
    <circle cx="140" cy="115" r="12" fill="#2d333b" />

    <!-- Storage Selector -->
    <text x="25" y="155" fill="#a1a1a6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">STORAGE CAPACITY</text>
    
    <rect x="25" y="170" width="110" height="42" rx="10" fill="#2c2c2e" stroke="#0071e3" stroke-width="2" />
    <text x="40" y="194" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">256 GB</text>
    <text x="90" y="194" fill="#47a3ff" font-family="system-ui, -apple-system, sans-serif" font-size="10">Incl.</text>

    <rect x="145" y="170" width="110" height="42" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1" />
    <text x="160" y="194" fill="#86868b" font-family="system-ui, -apple-system, sans-serif" font-size="12">512 GB</text>
    <text x="210" y="194" fill="#86868b" font-family="system-ui, -apple-system, sans-serif" font-size="10">+$200</text>

    <!-- Cart Summary Box -->
    <rect x="20" y="235" width="240" height="75" rx="14" fill="#0c0c0e" stroke="#2c2c2e" stroke-width="1" />
    <text x="35" y="260" fill="#a1a1a6" font-family="system-ui, -apple-system, sans-serif" font-size="11">Order Subtotal:</text>
    <text x="175" y="260" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">$3,498.00</text>
    <text x="35" y="285" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11">✓ Free Express Delivery to Door</text>

    <!-- Checkout Action Button -->
    <rect x="20" y="325" width="240" height="40" rx="14" fill="#f5f5f7" />
    <text x="85" y="350" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Instant Checkout</text>
  </g>
</svg>

