<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Ambient light blobs -->
  <circle cx="150" cy="120" r="140" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />
  <circle cx="680" cy="380" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Top App Navigation Bar Mockup -->
  <rect x="40" y="30" width="720" height="50" rx="14" fill="#1e293b" opacity="0.85" stroke="#334155" stroke-width="1" />
  <circle cx="65" cy="55" r="6" fill="#ef4444" />
  <circle cx="85" cy="55" r="6" fill="#eab308" />
  <circle cx="105" cy="55" r="6" fill="#22c55e" />
  
  <!-- App Title & Badge -->
  <text x="135" y="60" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">PharmaLink</text>
  <rect x="235" y="44" width="125" height="22" rx="11" fill="#0891b2" opacity="0.3" stroke="#06b6d4" stroke-width="1" />
  <text x="247" y="59" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">ENTERPRISE SAAS</text>

  <!-- Search / Status bar on nav -->
  <rect x="520" y="43" width="220" height="24" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="535" y="59" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Search medicines, batches...</text>

  <!-- Left Sidebar / Stats Cards -->
  <rect x="40" y="95" width="220" height="375" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  
  <!-- Sidebar header -->
  <text x="60" y="130" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SUPPLY METRICS</text>
  
  <!-- Metric Card 1 -->
  <rect x="55" y="145" width="190" height="85" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="70" y="172" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Dispensed Today</text>
  <text x="70" y="202" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">1,482</text>
  <text x="145" y="200" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">+18.4%</text>

  <!-- Metric Card 2 -->
  <rect x="55" y="245" width="190" height="85" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="70" y="272" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Batch Health Score</text>
  <text x="70" y="302" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">99.2%</text>
  <text x="145" y="300" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Optimal</text>

  <!-- Metric Card 3 -->
  <rect x="55" y="345" width="190" height="105" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="70" y="372" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Connected Pharmacies</text>
  <text x="70" y="402" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">28 Hubs</text>
  <rect x="70" y="420" width="160" height="6" rx="3" fill="#334155" />
  <rect x="70" y="420" width="130" height="6" rx="3" fill="url(#accentGrad)" />

  <!-- Main Dashboard View -->
  <rect x="275" y="95" width="485" height="375" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  
  <text x="305" y="135" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Inventory & Prescription Dispatch Console</text>
  <text x="305" y="155" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Centralized multi-tenant repository for pharmaceutical management</text>

  <!-- Table Mockup -->
  <!-- Table Header -->
  <rect x="295" y="175" width="445" height="34" rx="8" fill="#0f172a" />
  <text x="315" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">MEDICATION / PRODUCT</text>
  <text x="490" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">BATCH NO</text>
  <text x="590" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">EXPIRY</text>
  <text x="670" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">STATUS</text>

  <!-- Row 1 -->
  <rect x="295" y="215" width="445" height="42" rx="8" fill="#1e293b" opacity="0.4" />
  <circle cx="315" cy="236" r="5" fill="#06b6d4" />
  <text x="330" y="240" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Amoxicillin 500mg (Cap)</text>
  <text x="490" y="240" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">#AMX-2026-B</text>
  <text x="590" y="240" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">11/2028</text>
  <rect x="665" y="226" width="60" height="20" rx="10" fill="#065f46" />
  <text x="676" y="240" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">IN STOCK</text>

  <!-- Row 2 -->
  <rect x="295" y="263" width="445" height="42" rx="8" fill="#1e293b" opacity="0.6" />
  <circle cx="315" cy="284" r="5" fill="#3b82f6" />
  <text x="330" y="288" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Azithromycin 250mg</text>
  <text x="490" y="288" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">#AZT-8891-C</text>
  <text x="590" y="288" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">08/2027</text>
  <rect x="665" y="274" width="60" height="20" rx="10" fill="#065f46" />
  <text x="676" y="288" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">IN STOCK</text>

  <!-- Row 3 -->
  <rect x="295" y="311" width="445" height="42" rx="8" fill="#1e293b" opacity="0.4" />
  <circle cx="315" cy="332" r="5" fill="#f59e0b" />
  <text x="330" y="336" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Ciprofloxacin 500mg</text>
  <text x="490" y="336" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">#CPX-4102-A</text>
  <text x="590" y="336" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">04/2027</text>
  <rect x="665" y="322" width="60" height="20" rx="10" fill="#78350f" />
  <text x="674" y="336" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">RE-ORDER</text>

  <!-- Row 4 -->
  <rect x="295" y="359" width="445" height="42" rx="8" fill="#1e293b" opacity="0.6" />
  <circle cx="315" cy="380" r="5" fill="#10b981" />
  <text x="330" y="384" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Paracetamol IV 100ml</text>
  <text x="490" y="384" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">#PCM-9214-E</text>
  <text x="590" y="384" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">12/2029</text>
  <rect x="665" y="370" width="60" height="20" rx="10" fill="#065f46" />
  <text x="676" y="384" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">IN STOCK</text>

  <!-- Lower Action Strip -->
  <rect x="295" y="415" width="210" height="38" rx="10" fill="url(#accentGrad)" />
  <text x="335" y="439" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">+ Issue New Prescription</text>

  <rect x="515" y="415" width="225" height="38" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="548" y="439" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Export Regulatory Report</text>
</svg>

