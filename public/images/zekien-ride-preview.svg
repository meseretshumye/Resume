<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06131f" />
      <stop offset="50%" stop-color="#0b1e2e" />
      <stop offset="100%" stop-color="#020810" />
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#rideBg)" />

  <!-- Ambient glow -->
  <circle cx="400" cy="250" r="180" fill="#10b981" opacity="0.12" filter="url(#glowGreen)" />
  <circle cx="150" cy="400" r="140" fill="#06b6d4" opacity="0.1" filter="url(#glowGreen)" />

  <!-- Left Info Card / Highlights -->
  <g transform="translate(50, 80)">
    <rect width="210" height="340" rx="16" fill="#0f172a" opacity="0.85" stroke="#1e293b" stroke-width="1" />
    
    <rect x="20" y="24" width="115" height="22" rx="11" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="32" y="39" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">MOBILE APP</text>

    <text x="20" y="75" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">Zekien Ride</text>
    <text x="20" y="95" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Next-Gen Mobility App</text>

    <line x1="20" y1="115" x2="190" y2="115" stroke="#1e293b" stroke-width="1" />

    <text x="20" y="145" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">⚡ Live GPS Tracking</text>
    <text x="20" y="165" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Sub-second vehicle updates</text>

    <text x="20" y="205" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">📍 Instant Matching</text>
    <text x="20" y="225" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Smart nearest-driver dispatch</text>

    <text x="20" y="265" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">💳 Digital Wallet</text>
    <text x="20" y="285" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Telebirr, CBE &amp; in-app cash</text>

    <rect x="20" y="305" width="170" height="24" rx="12" fill="#047857" />
    <text x="45" y="321" fill="#ecfdf5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">React Native / Expo</text>
  </g>

  <!-- Centered Smartphone Mockup -->
  <g transform="translate(290, 20)">
    <!-- Outer phone frame -->
    <rect width="250" height="460" rx="36" fill="#090d16" stroke="#334155" stroke-width="4" />
    <!-- Screen inner area -->
    <rect x="8" y="8" width="234" height="444" rx="30" fill="#0b1320" />

    <!-- Dynamic Island / Top Speaker -->
    <rect x="85" y="18" width="80" height="18" rx="9" fill="#000000" />
    <circle cx="152" cy="27" r="4" fill="#1e293b" />

    <!-- Map representation (Grid lines & Streets) -->
    <rect x="8" y="44" width="234" height="240" fill="#0e1726" />
    
    <!-- Roads / Paths -->
    <path d="M 20 80 Q 90 90 140 160 T 230 200" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" />
    <path d="M 60 260 L 140 160 L 210 70" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
    <path d="M 10 180 L 230 180" fill="none" stroke="#1e293b" stroke-width="8" />

    <!-- Active Route Line (Glowing Emerald) -->
    <path d="M 50 240 Q 90 200 135 160 T 190 90" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-dasharray="6,4" />

    <!-- Driver Vehicle Marker -->
    <circle cx="135" cy="160" r="14" fill="#047857" opacity="0.4" />
    <circle cx="135" cy="160" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <!-- Car icon representation -->
    <rect x="130" y="155" width="10" height="10" rx="2" fill="#064e3b" />

    <!-- Destination Pin -->
    <circle cx="190" cy="90" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2" />

    <!-- Top floating ETA Badge -->
    <rect x="35" y="55" width="180" height="30" rx="15" fill="#0f172a" opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="50" y="74" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Driver Arriving in 3 min</text>
    <text x="175" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">850m</text>

    <!-- Bottom Ride Status Sheet (Inside Phone) -->
    <rect x="8" y="260" width="234" height="192" rx="24" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    
    <!-- Sheet handle bar -->
    <rect x="105" y="270" width="40" height="4" rx="2" fill="#334155" />

    <!-- Driver Info Row -->
    <circle cx="35" cy="308" r="18" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="28" y="313" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">DW</text>

    <text x="62" y="302" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Dawit K. (Captain)</text>
    <text x="62" y="318" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Toyota Corolla • 4.95 ★</text>

    <!-- Plate Badge -->
    <rect x="170" y="296" width="60" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="176" y="310" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">ET-3-8910</text>

    <!-- Fare & Trip details -->
    <rect x="20" y="335" width="210" height="50" rx="12" fill="#131c2e" />
    <text x="32" y="354" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Estimated Fare</text>
    <text x="32" y="375" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">240.00 ETB</text>

    <text x="140" y="354" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Payment</text>
    <text x="140" y="375" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Telebirr Pay</text>

    <!-- Action Button inside phone -->
    <rect x="20" y="398" width="210" height="38" rx="14" fill="url(#neonGreen)" />
    <text x="75" y="422" fill="#042f2e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">Track Live Route</text>
  </g>

  <!-- Right Side Stat / Feature Callout -->
  <g transform="translate(565, 80)">
    <rect width="185" height="340" rx="16" fill="#0f172a" opacity="0.85" stroke="#1e293b" stroke-width="1" />

    <text x="20" y="35" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">APP ARCHITECTURE</text>

    <!-- Stat 1 -->
    <rect x="15" y="55" width="155" height="70" rx="12" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
    <text x="25" y="78" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Dispatch Latency</text>
    <text x="25" y="105" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">&lt; 180 ms</text>

    <!-- Stat 2 -->
    <rect x="15" y="135" width="155" height="70" rx="12" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
    <text x="25" y="158" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Trip Completion</text>
    <text x="25" y="185" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">99.7%</text>

    <!-- Technologies list -->
    <text x="20" y="235" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Built With:</text>
    <text x="20" y="258" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• React Native &amp; Expo</text>
    <text x="20" y="278" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Node &amp; Socket.io</text>
    <text x="20" y="298" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Mapbox Navigation</text>
    <text x="20" y="318" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Redux State Store</text>
  </g>
</svg>

